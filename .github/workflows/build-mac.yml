name: Build macOS app

on:
  push:
    paths:
      - "desktop.py"
      - "rinse_tracker/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/build-mac.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Build app and disk image
        run: bash scripts/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Rinse-Tracker-macOS
          path: dist/Rinse-Tracker.dmg
          if-no-files-found: error
