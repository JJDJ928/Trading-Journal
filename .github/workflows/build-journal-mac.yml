name: Build Trading Journal (macOS)

on:
  push:
    paths:
      - "journal_desktop.py"
      - "journal/**"
      - "scripts/build_journal_*"
      - "scripts/make_journal_icon.py"
      - "installer/trading-journal.iss"
      - "requirements*.txt"
      - ".github/workflows/build-journal-mac.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_journal.py

      - name: Build app and disk image
        run: bash scripts/build_journal_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Trading-Journal-macOS
          path: dist/Trading-Journal.dmg
          if-no-files-found: error
