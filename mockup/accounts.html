<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hud.css">
</head>
<body data-page="accounts" data-title="Accounts">
<section id="content" class="page">
  <div class="toolbar">
    <div class="field"><span class="k">Show</span> Active &amp; recent <span class="chev">▼</span></div>
    <div class="muted" style="margin-left:14px;font-size:13.5px"><b style="color:var(--text);font-weight:600">6</b> active &nbsp;·&nbsp; <b style="color:var(--text);font-weight:600">$912,480</b> combined &nbsp;·&nbsp; <b class="up" style="font-weight:600">+$12,480</b> total P&amp;L</div>
    <div class="grow"></div>
    <button class="btn primary" data-open>+ Add account</button>
  </div>


  <div class="cards" id="cards"></div>

  <div class="scrim" hidden>
    <div class="modal" style="width:560px">
      <h2>Add account <small data-close>✕</small></h2>
      <div class="form">
        <div class="f w4"><label>Name</label><div class="in focus">Apex 150K #4</div></div>
        <div class="f w2"><label>Firm or broker</label><div class="in">Apex Trader Funding <span class="muted">▾</span></div></div>
        <div class="f w2"><label>Type</label><div class="seg"><span>Evaluation</span><span class="on">Funded</span></div></div>
        <div class="f w2"><label>Starting balance</label><div class="in">$150,000</div></div>
        <div class="f w2"><label>Max drawdown</label><div class="in">$5,000</div></div>
        <div class="f w4"><label>Notes</label><div class="in area">Trade only NQ and ES, max 2 contracts.</div></div>
      </div>
      <div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary">Save account</button></div>
    </div>
  </div>
</section>

<script src="chrome.js"></script>
<script>
  // name, firm, type, status, balance, pnl, trades, winrate, progress label, progress value, progress %, spark
  const accts = [
    ["Apex 150K #2", "Apex Trader Funding", "Funded", "Active", 154210, 4210, 31, "71%", "Drawdown left", "$4,320 of $5,000", 86, [0, 1, 0.5, 2, 1.6, 2.8, 3.3, 3, 4.2]],
    ["Apex 150K #3", "Apex Trader Funding", "Funded", "Active", 152960, 2960, 24, "63%", "Drawdown left", "$3,880 of $5,000", 78, [0, -0.5, 0.6, 1.2, 0.9, 1.8, 2.2, 2.6, 3]],
    ["Topstep 100K #1", "Topstep", "Funded", "Active", 102890, 2890, 22, "68%", "Drawdown left", "$2,410 of $3,000", 80, [0, 0.4, 1.1, 0.8, 1.5, 2.3, 2, 2.6, 2.9]],
    ["Apex 50K #5", "Apex Trader Funding", "Evaluation", "Active", 52180, 2180, 12, "75%", "Profit target", "$2,180 of $3,000", 73, [0, 0.3, 0.9, 0.7, 1.2, 1.6, 1.9, 2.1, 2.2]],
    ["Topstep 50K #2", "Topstep", "Evaluation", "Passed", 53060, 3060, 14, "71%", "Profit target", "$3,060 of $3,000", 100, [0, 0.6, 0.4, 1.3, 1.8, 2.1, 2.6, 2.9, 3.1]],
    ["Apex 50K #4", "Apex Trader Funding", "Evaluation", "Breached", 47500, -2500, 9, "33%", "Drawdown used", "$2,500 of $2,500", 100, [0, -0.4, 0.2, -0.8, -1.1, -0.7, -1.6, -2.1, -2.5]],
  ];
  const money = (v) => (v >= 0 ? "+$" : "−$") + Math.abs(v).toLocaleString();
  const spark = (pts, pos) => {
    const min = Math.min(...pts), max = Math.max(...pts), w = 300, h = 60;
    const d = pts.map((v, i) => (i ? "L" : "M") + ((i / (pts.length - 1)) * w).toFixed(1) + " " + (h - 4 - ((v - min) / (max - min || 1)) * (h - 8)).toFixed(1)).join(" ");
    const col = pos ? "#2bd98f" : "#ff5a6e";
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${col}" fill-opacity=".07"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
  };
  document.getElementById("cards").innerHTML = accts.map(([name, firm, type, status, bal, pnl, n, wr, plabel, pval, pct, pts]) => {
    const pill = status === "Passed" ? "l" : status === "Breached" ? "s" : "n";
    const bar = status === "Breached" ? "background:var(--red)" : status === "Passed" ? "background:var(--green)" : "";
    return `
    <div class="panel acct ${status === "Breached" ? "dead" : ""}">
      <div class="row1">
        <div><div class="name">${name}</div><div class="firm">${firm} · ${type}</div></div>
        <span class="pill ${pill}">${status.toUpperCase()}</span>
      </div>
      <div class="bal"><span class="big">$${bal.toLocaleString()}</span><span class="pnl ${pnl >= 0 ? "up" : "dn"}">${money(pnl)}</span></div>
      <div class="spark">${spark(pts, pnl >= 0)}</div>
      <div class="prog"><span>${plabel}</span><span>${pval}</span></div>
      <div class="barline"><i style="width:${pct}%;${bar}"></i></div>
      <div class="prog" style="margin-top:14px"><span>${n} trades · ${wr} win rate</span><span>View →</span></div>
    </div>`;
  }).join("");
</script>
</body>
</html>
