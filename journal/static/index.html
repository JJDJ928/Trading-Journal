<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Journal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23000'/><circle cx='16' cy='16' r='7.5' fill='none' stroke='white' stroke-width='1.6'/><circle cx='16' cy='16' r='2.6' fill='white'/><circle cx='25' cy='7' r='2' fill='white'/></svg>">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="welcome" id="welcome">
  <canvas id="welcome-atom"></canvas>
  <div class="greet">
    <div class="hello"><span data-greeting>Hello</span>, <span data-name>Jordi</span></div>
    <div class="hint">CLICK ANYWHERE TO CONTINUE</div>
  </div>
</div>

<div class="app">
  <aside class="rail">
    <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="1.4" aria-hidden="true">
      <circle cx="16" cy="16" r="13" stroke-opacity=".35"/>
      <circle cx="16" cy="16" r="7.5"/>
      <circle cx="16" cy="16" r="2.6" fill="#fff" stroke="none"/>
      <circle cx="25.2" cy="6.8" r="2" fill="#fff" stroke="none"/>
    </svg>
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg><span>Home</span></a>
    <a href="#/trades" data-nav="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M9 11h6M9 15h6"/></svg><span>Trades</span></a>
    <a href="#/accounts" data-nav="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Accounts</span></a>
    <div class="spacer"></div>
    <a data-action="settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><span>Settings</span></a>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="page-title"></h1>
      <div class="grow"></div>
      <div class="clock"><span id="clock"></span><small id="date"></small></div>
    </header>
    <div id="view"></div>
  </div>
</div>

<div id="modal-root"></div>
<script src="/static/js/atom.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
